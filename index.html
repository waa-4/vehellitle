<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>veHELLitle</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#eee;font-family:Arial,sans-serif}button,select,input{font:inherit}button,select{background:#28282f;color:#eee;border:1px solid #45454f;border-radius:6px;padding:9px 12px;cursor:pointer}button:hover:not(:disabled){background:#363640}button:disabled{opacity:.4;cursor:default}h1{color:#ff6262;text-align:center;margin:20px 0 4px;font-size:34px}.top{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px auto;padding:0 12px}.custom{display:none;max-width:650px;margin:10px auto;padding:15px;background:#1c1c23;border:1px solid #34343e;border-radius:8px}.custom.show{display:block}.custom-fields{display:flex;flex-wrap:wrap;align-items:end;gap:12px}.custom label{flex:1;min-width:130px;font-size:13px}.custom input{width:100%;margin-top:6px;background:#101014;color:white;border:1px solid #45454f;border-radius:5px;padding:8px}.layout{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;max-width:1200px;gap:12px;margin:20px auto;padding:0 15px}.characters{display:flex;flex-direction:column;gap:9px;align-items:stretch}.character{width:100%;padding:7px;background:#202027;border:1px solid #393940;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}.character img{width:64px;height:64px;object-fit:contain;background:white;border-radius:3px}.character span{font-size:12px;overflow-wrap:anywhere;text-align:center}.center{min-width:0}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:#b8b8c1;font-size:13px}#board{overflow-x:auto;max-height:65vh;overflow-y:auto;padding:4px}.guess-row{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));gap:4px;margin-bottom:4px;min-width:max(100%,calc(var(--columns)*28px))}.cell{aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;border:1px solid #393940;background:#222229;border-radius:3px;overflow:hidden}.current .cell{border-color:#777783}.cell img{width:100%;height:100%;object-fit:contain}.cell.exact{background:#388f52;border-color:#388f52}.cell.present{background:#b49434;border-color:#b49434}.cell.absent{background:#494951;border-color:#494951}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:14px 0}.primary{background:#9f2932;border-color:#9f2932}.primary:hover:not(:disabled){background:#b23540}#message{text-align:center;color:#c5c5ce;font-size:14px;min-height:22px}.success{color:#70ce87!important}.error{color:#f17c7c!important}.daily-result{border:1px solid #383840;background:#1c1c23;border-radius:8px;padding:14px;margin-top:12px;text-align:center}.daily-result p{margin:4px 0 10px;color:#c5c5ce;font-size:14px}[hidden]{display:none!important}@media(max-width:700px){h1{font-size:28px}.layout{grid-template-columns:75px minmax(0,1fr) 75px;gap:5px;padding:0 5px}.character{padding:3px}.character img{width:48px;height:48px;max-width:100%}.character span{font-size:10px}.guess-row{gap:2px;margin-bottom:2px}.cell{min-height:22px}.actions button{padding:8px;font-size:12px}}
</style>
</head>
<body>
<h1>veHELLitle</h1>
<div class="top">
<select id="difficulty" aria-label="Difficulty">
<option value="daily">Daily Puzzle</option><option value="classic">Classic</option><option value="hard">Hard</option><option value="insane">Insane</option><option value="roulette">Roulette</option><option value="bigsize">Big Size</option><option value="ultraroulette">Ultra Roulette</option><option value="nojob">No Job</option><option value="nightmare">Nightmare</option><option value="custom">Custom</option>
</select>
<button id="voice-button" type="button">VOICE: ON</button><button id="reset-btn" type="button">Reset Current</button><button id="new-btn" type="button">New Round</button>
</div>
<div class="custom" id="custom-panel"><div class="custom-fields">
<label>Sequence length<input id="custom-length" type="number" min="1" max="24" value="8"></label>
<label>Attempts<input id="custom-attempts" type="number" min="1" max="20" value="6"></label>
<label>Character choices<input id="custom-choices" type="number" min="1" max="100" value="4"></label>
</div><div class="actions"><button id="apply-custom" class="primary" type="button">Apply Settings</button></div></div>
<div class="layout"><div class="characters" id="left-panel"></div><main class="center">
<div class="status"><span id="mode-label">Daily Puzzle</span><span id="attempt-count">Attempt 1 / 6</span></div>
<div id="board"></div><div class="actions"><button id="delete-btn" type="button">Delete</button><button id="submit-btn" type="button" class="primary">Submit</button></div>
<div id="message" aria-live="polite"></div>
<div class="daily-result" id="daily-result" hidden><p id="daily-result-text"></p><div class="actions"><button id="daily-replay" type="button">Play Again</button><button id="daily-copy" class="primary" type="button">Copy Result</button></div></div>
</main><div class="characters" id="right-panel"></div></div>
<script src="stuff.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const configured = Array.isArray(window.CHARACTERS) ? window.CHARACTERS : [];
const seen = new Set();
const characters = configured.filter(x => x && typeof x.NAME === 'string' && x.NAME.trim() && typeof x.IMAGE === 'string' && x.IMAGE.trim()).map(x => ({name:x.NAME.trim(),image:x.IMAGE.trim()})).filter(x=>{const key=x.name.toLowerCase();if(seen.has(key))return false;seen.add(key);return true;});
const modes = {
 daily:{length:8,attempts:6,choices:4},classic:{length:8,attempts:6,choices:4},
 hard:{length:10,attempts:6,choices:8},insane:{length:12,attempts:5,choices:16},
 roulette:{length:1,attempts:3,choices:2},bigsize:{length:18,attempts:14,choices:2},
 ultraroulette:{length:1,attempts:5,choices:16},nojob:{length:14,attempts:10,choices:12},
 nightmare:{length:16,attempts:4,choices:24},custom:{length:8,attempts:6,choices:4}
};
const state={mode:'daily',pool:[],answer:[],guesses:[],draft:[],complete:false,won:false,voice:true,day:''};
const randomNumber=max=>{if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max;}return Math.floor(Math.random()*max);};
function utcDay(){return new Date().toISOString().slice(0,10);}
function dateDisplay(day){if(!day)return '';const [y,m,d]=day.split('-');return `${m}/${d}/${y}`;}
// Stable across browsers for a given date and ordered character list.
function dailyAnswer(day,length,poolSize){let seed=2166136261;for(const c of 'veHELLitle:'+day){seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;}const result=[];for(let i=0;i<length;i++){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;seed>>>=0;result.push(seed%poolSize);}return result;}
function message(text,kind=''){$('message').textContent=text;$('message').className=kind;}
function speak(name){if(!state.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(name);voice.volume=.4;voice.rate=.65;voice.pitch=.5;const english=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));voice.voice=english.find(v=>/soft|whisper/i.test(v.name))||english[0]||null;speechSynthesis.speak(voice);}catch(error){console.warn('Speech unavailable',error);}}
function choose(index){if(state.complete||state.draft.length>=modes[state.mode].length)return;state.draft.push(index);speak(state.pool[index].name);render();}
function drawChoices(){$('left-panel').replaceChildren();$('right-panel').replaceChildren();state.pool.forEach((char,index)=>{const btn=document.createElement('button');btn.type='button';btn.className='character';btn.title=char.name;const img=document.createElement('img');img.src=char.image;img.alt=char.name;const label=document.createElement('span');label.textContent=char.name;btn.append(img,label);btn.addEventListener('click',()=>choose(index));$(index%2===0?'left-panel':'right-panel').append(btn);});}
function score(guess,answer){const result=Array(guess.length).fill('absent');const remain=new Map();for(let i=0;i<answer.length;i++){if(guess[i]===answer[i])result[i]='exact';else remain.set(answer[i],(remain.get(answer[i])||0)+1);}for(let i=0;i<guess.length;i++){if(result[i]==='exact')continue;const n=remain.get(guess[i])||0;if(n>0){result[i]='present';remain.set(guess[i],n-1);}}return result;}
function makeCell(index,status=''){const cell=document.createElement('div');cell.className='cell '+status;if(index!==undefined&&state.pool[index]){const img=document.createElement('img');img.src=state.pool[index].image;img.alt=state.pool[index].name;cell.append(img);}return cell;}
function render(){const mode=modes[state.mode];$('board').replaceChildren();$('mode-label').textContent=$('difficulty').selectedOptions[0].textContent+(state.mode==='daily'?' · '+dateDisplay(state.day):'');$('attempt-count').textContent=state.complete?(state.won?'SEQUENCE FOUND':'NO ATTEMPTS LEFT'):`Attempt ${state.guesses.length+1} / ${mode.attempts}`;for(let r=0;r<mode.attempts;r++){const current=r===state.guesses.length&&!state.complete;const row=document.createElement('div');row.className='guess-row'+(current?' current':'');row.style.setProperty('--columns',String(mode.length));let guess=[],feedback=null;if(r<state.guesses.length){guess=state.guesses[r];feedback=score(guess,state.answer);}else if(current)guess=state.draft;for(let i=0;i<mode.length;i++)row.append(makeCell(guess[i],feedback?feedback[i]:''));$('board').append(row);}$('submit-btn').disabled=state.complete||state.draft.length!==mode.length;$('delete-btn').disabled=state.complete||!state.draft.length;$('daily-result').hidden=!(state.mode==='daily'&&state.complete);if(state.mode==='daily'&&state.complete)$('daily-result-text').textContent=state.won?`Solved in ${state.guesses.length}/${mode.attempts}.`:`Not solved (${mode.attempts}/${mode.attempts}).`;}
function shareText(){const attempts=modes.daily.attempts;const count=state.won?state.guesses.length:'X';const rows=state.guesses.map(g=>score(g,state.answer).map(s=>s==='exact'?'🟩':s==='present'?'🟨':'⬛').join(''));return [`veHELLitle. ${count}/${attempts} ${dateDisplay(state.day)}`,...rows,'',"Play today's dumb puzzle at https://waa-4.github.io/vehellitle/"].join('\n');}
async function copyResult(){const text=shareText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.left='-9999px';document.body.append(area);area.select();if(!document.execCommand('copy'))throw Error('Copy failed');area.remove();}message('Result copied.','success');}catch(error){window.prompt('Copy your result:',text);message('Copy the result from the box.');}}
function submit(){const mode=modes[state.mode];if(state.complete||state.draft.length!==mode.length)return;const guess=[...state.draft];state.guesses.push(guess);state.won=guess.every((v,i)=>v===state.answer[i]);state.draft=[];state.complete=state.won||state.guesses.length>=mode.attempts;message(state.won?'Correct.':state.complete?'Out of attempts.':'Incorrect.',state.won?'success':state.complete?'error':'');render();$('board').scrollTop=$('board').scrollHeight;}
function resetCurrent(){state.guesses=[];state.draft=[];state.complete=false;state.won=false;message('Round reset.');render();$('board').scrollTop=0;}
function newRound(){if(!characters.length){state.pool=[];state.answer=[];state.guesses=[];state.draft=[];state.complete=true;drawChoices();render();message('No characters found in stuff.js.','error');return;}const mode=modes[state.mode];const previous=state.answer.join(',');state.pool=characters.slice(0,Math.min(mode.choices,characters.length));state.day=utcDay();if(state.mode==='daily'){state.answer=dailyAnswer(state.day,mode.length,state.pool.length);}else{let answer=[];for(let i=0;i<10;i++){answer=Array.from({length:mode.length},()=>randomNumber(state.pool.length));if(answer.join(',')!==previous)break;}state.answer=answer;}drawChoices();resetCurrent();message(state.mode==='daily'?`Daily puzzle · ${dateDisplay(state.day)}`:'Choose a character.');}
function clamp(x,min,max,fallback){return Number.isFinite(x)?Math.max(min,Math.min(max,Math.floor(x))):fallback;}
function applyCustom(){const length=clamp(Number($('custom-length').value),1,24,8),attempts=clamp(Number($('custom-attempts').value),1,20,6),choices=clamp(Number($('custom-choices').value),1,Math.max(1,characters.length),4);$('custom-length').value=length;$('custom-attempts').value=attempts;$('custom-choices').value=choices;modes.custom={length,attempts,choices};if(state.mode==='custom')newRound();}
$('difficulty').addEventListener('change',e=>{state.mode=e.target.value;$('custom-panel').classList.toggle('show',state.mode==='custom');newRound();});
$('apply-custom').addEventListener('click',applyCustom);
$('voice-button').addEventListener('click',()=>{state.voice=!state.voice;$('voice-button').textContent='VOICE: '+(state.voice?'ON':'OFF');if(!state.voice&&'speechSynthesis'in window)speechSynthesis.cancel();});
$('delete-btn').addEventListener('click',()=>{if(!state.complete){state.draft.pop();render();}});
$('submit-btn').addEventListener('click',submit);$('reset-btn').addEventListener('click',resetCurrent);$('new-btn').addEventListener('click',newRound);$('daily-replay').addEventListener('click',resetCurrent);$('daily-copy').addEventListener('click',copyResult);
window.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='Backspace'){e.preventDefault();if(!state.complete){state.draft.pop();render();}}else if(e.key==='Enter')submit();});
$('custom-choices').max=Math.max(1,characters.length);newRound();
})();
</script>
</body>
</html>
